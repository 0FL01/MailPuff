[package]
name = "mailpuff"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Docker-only mail-to-Telegram bridge with temporary in-memory HTML viewer"
publish = false

[[bin]]
name = "mailpuff"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ammonia = "4.1.2"
async-imap = "0.11.2"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["http1", "tokio"] }
base64 = "0.22"
figment = { version = "0.10", features = ["env"] }
futures-util = "0.3"
getrandom = "0.3"
html-escape = "0.2"
mail-parser = { version = "0.11.3", features = ["encoding_rs"] }
rustls = "0.23.40"
rustls-pki-types = "1"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
subtle = "2.6"
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.23", features = ["v4"] }
webpki-roots = "1.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"

[lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
wildcard_dependencies = "warn"
